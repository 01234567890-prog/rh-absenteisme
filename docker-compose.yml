version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rh_absenteisme
      POSTGRES_USER: rh_user
      POSTGRES_PASSWORD: rh_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
